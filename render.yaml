services:
  - type: web
    name: pinterest-pin-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PIN_API_KEY
        sync: false
      - key: PINTEREST_CLIENT_ID
        sync: false
      - key: PINTEREST_CLIENT_SECRET
        sync: false
      - key: PINTEREST_ENV
        value: production
      - key: PINTEREST_TOKEN_FILE
        value: /var/data/pinterest_tokens.json
      - key: PINTEREST_TOKENS_JSON_B64
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
    disk:
      name: pinterest-token-data
      mountPath: /var/data
      sizeGB: 1